<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#27272a" stroke-width="6"/>

  <!-- Glowing Accent Bar -->
  <circle cx="256" cy="256" r="140" fill="url(#neonGrad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Centered Tally / Life Stat Symbol -->
  <!-- 4 vertical tally bars + 1 diagonal slash (classic 5-stat count) -->
  <g transform="translate(146, 156)" stroke="url(#neonGrad)" stroke-width="24" stroke-linecap="round">
    <line x1="20" y1="20" x2="20" y2="180" />
    <line x1="75" y1="20" x2="75" y2="180" />
    <line x1="130" y1="20" x2="130" y2="180" />
    <line x1="185" y1="20" x2="185" y2="180" />
    <!-- Diagonal strike-through -->
    <line x1="0" y1="170" x2="210" y2="30" stroke="#10b981" stroke-width="26" />
  </g>

  <!-- Small neon indicator pulse -->
  <circle cx="390" cy="120" r="14" fill="#10b981" filter="url(#glow)"/>
</svg>
